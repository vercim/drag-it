modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "LGPL-3.0-only"

[[mods]]
modId = "dragit"
version = "${version}"
displayName = "Drag It!"
# NeoForge 26.2+ deprecates logoFile/logoBlur in favour of iconFile/iconBlur and warns at startup when only the old key is set; older versions only know logoFile.
iconFile = "icon.png"
iconBlur = false
logoFile = "icon.png"
logoBlur = false
displayURL = "https://github.com/vercim/drag-it"
issueTrackerURL = "https://github.com/vercim/drag-it/issues"
authors = "vercim"
description = '''
Smooth drag & drop for the resource pack selection screen.
'''

[[dependencies.dragit]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.dragit]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "dragit.mixins.json"
