org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Project identity
mod_id=dragit
mod_version=1.0.1
mod_group=dev.vercim

# Shared by every target. Per-target values (fabric_loader_min_version, neoforge_version, minecraft_version_range)
# live in versions/<target>/gradle.properties.
java_version=21

# Dependencies
fabric_loader_version=0.19.5
neoforge_loader_version_range=[4,)

# Fabric dev client only (modLocalRuntime): Fabric API and Mod Menu, keyed by the Minecraft version with `_` for `.`.
# Neither is on the compile classpath or in the JAR. A new Fabric target needs both entries.
fabric_api_version_1_20_1=0.92.12+1.20.1
fabric_api_version_1_21_1=0.116.17+1.21.1
fabric_api_version_1_21_4=0.119.4+1.21.4
fabric_api_version_1_21_10=0.138.4+1.21.10
fabric_api_version_1_21_11=0.141.6+1.21.11
fabric_api_version_26_1=0.145.1+26.1
fabric_api_version_26_1_2=0.155.3+26.1.2
fabric_api_version_26_2=0.161.0+26.2
fabric_api_version_26_3=0.163.0+26.3
modmenu_version_1_20_1=7.2.2
modmenu_version_1_21_1=11.0.5
modmenu_version_1_21_4=13.0.4
modmenu_version_1_21_10=16.0.1
modmenu_version_1_21_11=17.0.1
modmenu_version_26_1=18.0.2
